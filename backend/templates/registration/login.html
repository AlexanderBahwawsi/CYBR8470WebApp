{% extends "base.html" %}
{% block title %}Sign in · VulnLedger{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  <p class="muted">Track security findings from discovery to fix.</p>
  {% if form.errors %}<p class="flash error">Username or password is incorrect.</p>{% endif %}
  <form method="post" class="stack">
    {% csrf_token %}
    <label>Username {{ form.username }}</label>
    <label>Password {{ form.password }}</label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
